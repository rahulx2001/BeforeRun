[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beforerun"
version = "0.1.0.dev0"
description = "Local development scaffold for BeforeRun, a dependency investigator."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.14,<3.0",
    "uvicorn>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
beforerun = "beforerun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beforerun = ["static/*", "features/prompts/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: explicitly authorized external integration; never run by default",
    "browser: real headless browser with mocked APIs; run separately on prepared hosts",
]

