name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the development framework
        run: make install PYTHON=python
      - name: Compile and lint the scaffold
        run: make check

# Core behavior tests will be written with the core functionality during the event.

