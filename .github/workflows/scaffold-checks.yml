name: BeforeRun offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the trusted development framework
        run: make install PYTHON=python
      - name: Compile, lint, and run offline behavior contracts
        run: make check

